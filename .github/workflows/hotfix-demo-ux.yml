name: One-shot live demo UX hotfix

on:
  push:
    branches:
      - main
    paths:
      - scripts/hotfix_demo.py
      - .github/workflows/hotfix-demo-ux.yml

permissions:
  contents: write

jobs:
  patch-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch demo journey
        run: python scripts/hotfix_demo.py

      - name: Check browser JavaScript syntax
        run: |
          python -c "from pathlib import Path; t=Path('frontend/app.html').read_text(); Path('/tmp/segue-app.js').write_text(t.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/segue-app.js

      - name: Commit hotfix
        run: |
          rm scripts/hotfix_demo.py
          rm .github/workflows/hotfix-demo-ux.yml
          git config user.name "Segue hotfix"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/app.html scripts/hotfix_demo.py .github/workflows/hotfix-demo-ux.yml
          git commit -m "Fix live demo journey"
          git push origin HEAD:main
