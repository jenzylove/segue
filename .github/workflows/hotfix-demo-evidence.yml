name: One-shot demo evidence hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hotfix-demo-evidence.yml

permissions:
  contents: write

jobs:
  patch-demo-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch demo evidence fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/app.html')
          text = path.read_text(encoding='utf-8')

          old_timeline = "function renderTimeline(events, hashes) { const root = $('timeline'); if (!events.length) { root.innerHTML = `<div class=\"empty\">No durable mission evidence for this wallet yet.</div>`; return; } const items = [];"
          new_timeline = "function renderTimeline(events, hashes) { const root = $('timeline'); if (!events.length && demoMode) { const proof = [{kind:'NVDAc approval',tx:'0x54851555018424d3d9474fefcfc977fa12950450a0a92762b803a8df1bcfe24d'},{kind:'Collateral supplied',tx:'0x934f5a9241ccc429acdc5672427dc46e2d30b940d030b6801336efce357df953'},{kind:'1 USDC borrowed',tx:'0x341e9afc0ea0a09c81e0e64332f0283257cc5b3727db222d9f0a50b5d50963f5'}]; root.innerHTML = proof.map(item => `<div class=\"item live\"><strong>${item.kind}</strong><span>Verified Base mainnet reference transaction</span><a href=\"https://basescan.org/tx/${item.tx}\" target=\"_blank\" rel=\"noreferrer\"><code>${item.tx}</code></a></div>`).join(''); return; } if (!events.length) { root.innerHTML = `<div class=\"empty\">No durable mission evidence for this wallet yet.</div>`; return; } const items = [];"
          if old_timeline not in text:
              raise SystemExit('timeline anchor not found')
          text = text.replace(old_timeline, new_timeline, 1)

          old_nomission = "if (missionResult.status === 'fulfilled') { const list = missionResult.value; if (list.missions?.length) renderMission(list.missions[0]); else { mission = null; set('mission-state', 'NO MISSION'); set('route-title', 'No active credit mission'); set('policy', 'This wallet has no durable credit mission. Portfolio and sequence features remain available.'); } }"
          new_nomission = "if (missionResult.status === 'fulfilled') { const list = missionResult.value; if (list.missions?.length) renderMission(list.missions[0]); else { mission = null; if (demoMode && positionResult.status === 'fulfilled' && Number(positionResult.value?.position?.borrow_shares || 0) > 0) { set('mission-state', 'BORROWED'); set('route-title', 'Borrowed · monitoring'); set('policy', 'Live Base reference position. Credit state is read directly from Morpho/Base; the original durable mission record is not present in this deployment.'); } else { set('mission-state', 'NO MISSION'); set('route-title', 'No active credit mission'); set('policy', 'This wallet has no durable credit mission. Portfolio and sequence features remain available.'); } } }"
          if old_nomission not in text:
              raise SystemExit('mission fallback anchor not found')
          text = text.replace(old_nomission, new_nomission, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('frontend/app.html').read_text(encoding='utf-8')
          script = text.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/segue-app.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/segue-app.js

      - name: Commit hotfix
        shell: bash
        run: |
          rm .github/workflows/hotfix-demo-evidence.yml
          git config user.name "Segue hotfix"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/app.html .github/workflows/hotfix-demo-evidence.yml
          git commit -m "Wire live demo onchain evidence"
          git push origin HEAD:main
