name: contracts

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'script/**'
      - 'test/**'
      - 'foundry.toml'
      - 'scripts/verify_m2_artifacts.py'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'script/**'
      - 'test/**'
      - 'foundry.toml'
      - 'scripts/verify_m2_artifacts.py'
      - '.github/workflows/contracts.yml'

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build
        run: forge build
      - name: Verify M2 artifact selectors
        run: python scripts/verify_m2_artifacts.py
      - name: Test
        run: forge test -vv
